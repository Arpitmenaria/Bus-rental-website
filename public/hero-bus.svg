<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="ShivShakti Tourist luxury bus">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="65%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Ambient glow behind bus -->
  <ellipse cx="400" cy="290" rx="360" ry="200" fill="url(#glow)"/>

  <!-- Road -->
  <rect x="0" y="432" width="800" height="68" fill="#0f172a"/>
  <rect x="0" y="430" width="800" height="4" fill="#1e293b"/>
  <!-- Center dashes -->
  <rect x="32"  y="452" width="88" height="7" rx="3" fill="white" opacity="0.42"/>
  <rect x="192" y="452" width="88" height="7" rx="3" fill="white" opacity="0.42"/>
  <rect x="352" y="452" width="88" height="7" rx="3" fill="white" opacity="0.42"/>
  <rect x="512" y="452" width="88" height="7" rx="3" fill="white" opacity="0.42"/>
  <rect x="672" y="452" width="88" height="7" rx="3" fill="white" opacity="0.42"/>
  <!-- Shoulder lines -->
  <line x1="0" y1="435" x2="800" y2="435" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>

  <!-- Bus -->
  <g filter="url(#shadow)">
    <!-- Undercarriage / lower skirt -->
    <rect x="114" y="368" width="572" height="64" rx="6" fill="#064e3b"/>

    <!-- Main body -->
    <rect x="104" y="215" width="592" height="165" rx="10" fill="#059669"/>
    <!-- Upper-body lighter tint for depth -->
    <rect x="104" y="215" width="592" height="55" rx="10" fill="#0ea573"/>
    <rect x="104" y="250" width="592" height="25" fill="#059669"/>

    <!-- Accent stripes -->
    <rect x="104" y="348" width="592" height="10" fill="white" opacity="0.82"/>
    <rect x="104" y="326" width="592" height="4"  fill="#a7f3d0" opacity="0.65"/>

    <!-- Roof -->
    <rect x="118" y="188" width="564" height="34" rx="8" fill="#047857"/>
    <rect x="118" y="213" width="564" height="8"  fill="#047857"/>

    <!-- AC unit -->
    <rect x="292" y="169" width="168" height="22" rx="4" fill="#1e293b"/>
    <rect x="300" y="165" width="152" height="6"  rx="2" fill="#374151"/>

    <!-- GPS antenna -->
    <circle cx="420" cy="163" r="5"  fill="#34d399" opacity="0.95"/>
    <circle cx="420" cy="163" r="10" fill="#34d399" opacity="0.2"/>

    <!-- Front windshield -->
    <rect x="685" y="228" width="9" height="120" rx="4" fill="#bfdbfe" opacity="0.65"/>
    <!-- Rear windshield -->
    <rect x="106" y="238" width="9" height="92"  rx="4" fill="#bfdbfe" opacity="0.5"/>

    <!-- Side windows (6) -->
    <rect x="155" y="238" width="74" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>
    <rect x="247" y="238" width="74" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>
    <rect x="339" y="238" width="74" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>
    <rect x="431" y="238" width="74" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>
    <rect x="523" y="238" width="74" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>
    <rect x="608" y="238" width="66" height="60" rx="6" fill="#bfdbfe" opacity="0.6"/>

    <!-- Destination board (front, lit) -->
    <rect x="675" y="202" width="26" height="15" rx="2" fill="#f0fdf4"/>
    <rect x="677" y="204" width="22" height="11" rx="1" fill="#bbf7d0" opacity="0.85"/>

    <!-- Headlights -->
    <ellipse cx="700" cy="284" rx="19" ry="12" fill="#fefce8" opacity="0.95"/>
    <ellipse cx="700" cy="284" rx="12" ry="7"  fill="#fbbf24"/>
    <ellipse cx="700" cy="284" rx="6"  ry="4"  fill="#fef9c3"/>

    <!-- Tail lights -->
    <ellipse cx="113" cy="280" rx="11" ry="10" fill="#fecaca" opacity="0.9"/>
    <ellipse cx="113" cy="280" rx="7"  ry="6"  fill="#ef4444"/>

    <!-- Front bumper -->
    <rect x="690" y="354" width="14" height="46" rx="4" fill="#9ca3af"/>
    <rect x="691" y="357" width="12" height="39" rx="3" fill="#d1d5db"/>

    <!-- Rear bumper -->
    <rect x="96"  y="354" width="14" height="46" rx="4" fill="#9ca3af"/>
    <rect x="97"  y="357" width="12" height="39" rx="3" fill="#d1d5db"/>

    <!-- Door -->
    <rect x="506" y="302" width="72" height="98" rx="4" fill="#047857"/>
    <rect x="510" y="328" width="64" height="50" rx="3" fill="#bfdbfe" opacity="0.5"/>
    <rect x="567" y="360" width="4"  height="18" rx="2" fill="#9ca3af"/>

    <!-- Front wheel -->
    <circle cx="595" cy="430" r="46" fill="#0f172a"/>
    <circle cx="595" cy="430" r="31" fill="#1e293b"/>
    <circle cx="595" cy="430" r="17" fill="#374151"/>
    <circle cx="595" cy="430" r="9"  fill="#9ca3af" opacity="0.7"/>
    <line x1="595" y1="399" x2="595" y2="461" stroke="#4b5563" stroke-width="3" opacity="0.55"/>
    <line x1="563" y1="430" x2="627" y2="430" stroke="#4b5563" stroke-width="3" opacity="0.55"/>
    <line x1="573" y1="407" x2="617" y2="453" stroke="#4b5563" stroke-width="2.5" opacity="0.55"/>
    <line x1="617" y1="407" x2="573" y2="453" stroke="#4b5563" stroke-width="2.5" opacity="0.55"/>

    <!-- Rear wheel -->
    <circle cx="213" cy="430" r="46" fill="#0f172a"/>
    <circle cx="213" cy="430" r="31" fill="#1e293b"/>
    <circle cx="213" cy="430" r="17" fill="#374151"/>
    <circle cx="213" cy="430" r="9"  fill="#9ca3af" opacity="0.7"/>
    <line x1="213" y1="399" x2="213" y2="461" stroke="#4b5563" stroke-width="3" opacity="0.55"/>
    <line x1="181" y1="430" x2="245" y2="430" stroke="#4b5563" stroke-width="3" opacity="0.55"/>
    <line x1="191" y1="407" x2="235" y2="453" stroke="#4b5563" stroke-width="2.5" opacity="0.55"/>
    <line x1="235" y1="407" x2="191" y2="453" stroke="#4b5563" stroke-width="2.5" opacity="0.55"/>

    <!-- Exhaust -->
    <rect x="123" y="400" width="5" height="26" rx="2" fill="#6b7280" opacity="0.8"/>
  </g>

  <!-- Brand watermark -->
  <text x="400" y="492" font-family="Georgia,serif" font-size="12" fill="white" opacity="0.38"
        text-anchor="middle" letter-spacing="4">SHIVSHAKTI TOURIST · UDAIPUR · RAJASTHAN</text>
</svg>
